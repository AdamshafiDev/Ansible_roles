- name: create ec2 and route53 records
  hosts: local
  connection: local
  vars:
   instances:
    - mysql
    - frontend
    - mongodb
    - reddis
   subnet_id: subnet-0e8b1a71514f2db01
   sg_id: sg-01e0445cb21079912 
   zone: adamshafi.shop
  tasks:
    - name: create ec2 instance
      amazon.aws.ec2_instance:
        name: "{{ item }}"
        vpc_subnet_id: "{{ subnet_id }}"
        instance_type: t3.micro
        security_group: "{{ sg_id }}"
        image_id: ami-0220d79f3f480ecf5
        tags:
         name: "{{ item }}"
      loop: "{{ instances }}"   
      register: ec2_output
    - name: print e2 output
      ansible.builtin.debug:
       msg: "{{ ec2_output }}"  
      
    - name: cerate route53 records
    
      amazon.aws.route53:
       state: present
       zone: "{{ zone }}"
       record: "{{ item.item }}.{{ zone }}"
       type: A
       ttl: 1
       value: "{{ item.instances[0].private_ip_address }}"
       wait: true
       overwrite: true
      loop: "{{ ec2_output.results }}"

    - name: cerate route53 records
      amazon.aws.route53:
       state: present
       zone: "{{ zone }}"
       record: "{{ zone }}"
       type: A
       ttl: 1
       value: "{{ item.instance[0].public_ip_address }}"
       wait: true
       overwrite: true
      loop: "{{ ec2_output.results }}"
      when: item.item == "frontend"
  

      